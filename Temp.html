<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Body Snippet Library</title>
    <style>
         :root {
            --bg: #090909;
            --panel: #111111;
            --panel2: #151515;
            --border: #292929;
            --text: #f4f4f4;
            --muted: #969696;
            --accent: #ef4444;
            --accent2: #7f1d1d;
            --code: #0b0b0b;
            --success: #4ade80;
        }
        
        * {
            box-sizing: border-box
        }
        
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif
        }
        
        body {
            padding: 28px
        }
        
        .header {
            max-width: 1500px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        
        .title-wrap h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -.5px
        }
        
        .title-wrap p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 13px
        }
        
        .badge {
            border: 1px solid #3b1717;
            background: #170c0c;
            color: #fca5a5;
            border-radius: 999px;
            padding: 9px 13px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        
        .toolbar {
            max-width: 1500px;
            margin: 0 auto 22px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .search {
            flex: 1;
            background: #0b0b0b;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 11px 13px;
            outline: none;
            font-size: 13px;
        }
        
        .search:focus {
            border-color: #7f1d1d
        }
        
        .count {
            font-size: 12px;
            color: var(--muted);
            padding: 0 8px
        }
        
        .grid {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            gap: 18px
        }
        
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
        }
        
        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #151515, #111);
        }
        
        .identity {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0
        }
        
        .serial {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: #241010;
            border: 1px solid #4b1818;
            color: #f87171;
            font-size: 12px;
            font-weight: 800;
        }
        
        .name {
            font-size: 15px;
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }
        
        .actions {
            display: flex;
            gap: 8px
        }
        
        button {
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: #ddd;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        
        button:hover {
            border-color: #5b2525;
            background: #211313
        }
        
        .copy-btn.copied {
            color: #86efac;
            border-color: #245c35;
            background: #102016
        }
        
        .columns {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            min-height: 300px;
        }
        
        .pane {
            min-width: 0
        }
        
        .pane+.pane {
            border-left: 1px solid var(--border)
        }
        
        .pane-title {
            height: 38px;
            padding: 11px 14px;
            font-size: 10px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #858585;
            border-bottom: 1px solid #222;
        }
        
        .code {
            margin: 0;
            padding: 16px;
            min-height: 260px;
            max-height: 520px;
            overflow: auto;
            background: var(--code);
            color: #d4d4d4;
            font: 12px/1.6 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .preview {
            background: #000;
            min-height: 260px;
            padding: 20px;
            overflow: auto;
        }
        
        .preview-frame {
            background: #0c0808;
            border: 1px solid #241111;
            border-radius: 14px;
            min-height: 220px;
            padding: 20px;
            overflow: auto;
        }
        
        .preview-frame table {
            max-width: 100%!important
        }
        
        .preview-frame img {
            max-width: 100%;
            height: auto
        }
        
        .empty {
            max-width: 1500px;
            margin: 40px auto;
            text-align: center;
            color: var(--muted);
            padding: 50px;
            border: 1px dashed var(--border);
            border-radius: 16px;
        }
        
        @media(max-width:900px) {
            body {
                padding: 14px
            }
            .header {
                align-items: flex-start;
                flex-direction: column
            }
            .columns {
                grid-template-columns: 1fr
            }
            .pane+.pane {
                border-left: 0;
                border-top: 1px solid var(--border)
            }
            .code {
                max-height: 400px
            }
        }
    </style>
</head>

        }];

        const grid = document.getElementById("grid");
        const empty = document.getElementById("empty");
        const count = document.getElementById("count");
        const search = document.getElementById("search");

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, ch => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[ch]));
        }

        function makePreview(code) {
            // Render the snippet as an email-style fragment while keeping it isolated.
            // Conditional Outlook comments are harmless in a normal browser.
            return `
    <div class="preview-frame">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr><td>${code}</td></tr>
      </table>
    </div>`;
        }

        function render(filter = "") {
            const q = filter.trim().toLowerCase();
            const filtered = snippets.filter(s =>
                !q || String(s.number).includes(q) || s.name.toLowerCase().includes(q)
            );

            grid.innerHTML = filtered.map(s => `
    <article class="card">
      <div class="card-head">
        <div class="identity">
          <div class="serial">${String(s.number).padStart(2,"0")}</div>
          <div class="name">${escapeHtml(s.name)}</div>
        </div>
        <div class="actions">
          <button class="copy-btn" data-number="${s.number}">Copy HTML</button>
        </div>
      </div>
      <div class="columns">
        <section class="pane">
          <div class="pane-title">HTML Code Snippet</div>
          <pre class="code">${escapeHtml(s.code)}</pre>
        </section>
        <section class="pane">
          <div class="pane-title">Snippet Result</div>
          <div class="preview">${makePreview(s.code)}</div>
        </section>
      </div>
    </article>
  `).join("");

            count.textContent = `${filtered.length} of ${snippets.length}`;
            empty.hidden = filtered.length !== 0;

            document.querySelectorAll(".copy-btn").forEach(btn => {
                btn.addEventListener("click", async() => {
                    const item = snippets.find(s => String(s.number) === btn.dataset.number);
                    try {
                        await navigator.clipboard.writeText(item.code);
                        btn.textContent = "Copied ✓";
                        btn.classList.add("copied");
                        setTimeout(() => {
                            btn.textContent = "Copy HTML";
                            btn.classList.remove("copied");
                        }, 1400);
                    } catch (e) {
                        // Clipboard fallback for file:// contexts where Clipboard API may be blocked.
                        const ta = document.createElement("textarea");
                        ta.value = item.code;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        ta.remove();
                        btn.textContent = "Copied ✓";
                        btn.classList.add("copied");
                        setTimeout(() => {
                            btn.textContent = "Copy HTML";
                            btn.classList.remove("copied");
                        }, 1400);
                    }
                });
            });
        }

        search.addEventListener("input", e => render(e.target.value));
        render();
    </script>
