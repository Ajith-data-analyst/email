<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Studio</title>
    <style>
        /* === BASE & RESET === */
        
         :root {
            --bg-dark: #000000;
            --card-bg: #0c0808;
            --input-bg: #1a1111;
            --border-red: #7f1d1d;
            --accent-red: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #ffffff;
            --text-sub: #f2b4b4;
            --success: #4ade80;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }
        /* === RESPONSIVE CONTAINER === */
        
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-red);
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px var(--accent-glow);
            position: relative;
            transition: max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        h2 {
            color: var(--accent-red);
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
        }
        /* === PROGRESS BAR === */
        
        .progress-container {
            width: 100%;
            background: #2a1616;
            border-radius: 10px;
            height: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7f1d1d, #ef4444, #f87171);
            width: 20%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--accent-red);
        }
        /* === WIZARD STEPS === */
        
        .step {
            display: none;
            animation: slideUp 0.4s ease forwards;
        }
        
        .step.active {
            display: block;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        label {
            display: block;
            margin-bottom: 12px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 700;
            color: var(--text-sub);
            text-align: center;
        }
        
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-red);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }
        
        input[type="text"],
        select {
            text-align: center;
            font-weight: bold;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        
        textarea {
            height: 150px;
            resize: vertical;
            line-height: 1.5;
            font-family: inherit;
        }
        
        textarea.code-mode {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            color: #4ade80;
        }
        /* === HTML TOGGLE === */
        
        .html-toggle-container {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }
        
        .html-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .html-toggle input {
            cursor: pointer;
            accent-color: var(--accent-red);
            width: 16px;
            height: 16px;
            margin: 0;
        }
        /* === BUTTONS === */
        
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 110px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:active {
            transform: scale(0.96);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #dc2828, #ef4444);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #ef4444, #f87171);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }
        
        .btn-secondary {
            background-color: #2a1616;
            color: var(--text-sub);
            border: 1px solid var(--border-red);
        }
        
        .btn-secondary:hover {
            background-color: #3f2222;
            color: white;
        }
        
        .btn-icon {
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        /* === ACTION LINKS & COUNTER === */
        
        .action-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .action-link {
            background: rgba(220, 40, 40, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            transition: all 0.3s;
        }
        
        .action-link:hover {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
            transform: translateY(-2px);
        }
        
        .counter {
            text-align: right;
            font-size: 11px;
            color: #888;
            margin-top: -12px;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        /* === STEP 5: SUMMARY & EDIT === */
        
        .summary-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #444;
            padding: 10px 0;
            gap: 10px;
        }
        
        .summary-row:last-child {
            border-bottom: none;
        }
        
        .summary-details {
            width: 75%;
            overflow: hidden;
        }
        
        .summary-label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 2px;
            display: block;
        }
        
        .summary-value {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .edit-jump {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }
        
        .edit-jump:hover {
            background: var(--success);
            color: #000;
        }
        /* === STEP 5: WORKSPACE (EDITOR/VIEWER WITH LINE NUMBERS) === */
        
        .workspace {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            height: 450px;
            opacity: 0;
            animation: fadeIn 0.5s 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 1px solid var(--border-red);
            border-radius: 10px;
            overflow: hidden;
            min-width: 0;
        }
        
        .panel-header {
            background: #1a1111;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .editor-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: #0a0505;
        }
        
        #line-numbers {
            width: 40px;
            background: #120909;
            color: #664444;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 11px;
            padding: 12px 4px 24px;
            text-align: right;
            user-select: none;
            overflow: hidden;
            line-height: 1.5;
            border-right: 1px solid #2a1515;
        }
        
        #code-editor {
            flex: 1;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 11px;
            background: transparent;
            color: #e2e8f0;
            padding: 12px;
            border: none;
            resize: none;
            width: 100%;
            height: 100%;
            margin: 0;
            outline: none;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
        }
        
        .view-modes {
            display: flex;
            gap: 3px;
        }
        
        .toggle-btn {
            background: #333;
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 9px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .toggle-btn.active {
            background: var(--accent-red);
        }
        
        #code-viewer-container {
            flex: 1;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }
        
        #code-viewer {
            border: none;
            background: #fff;
            width: 100%;
            height: 100%;
            transition: width 0.3s ease, height 0.3s ease;
        }
        
        #code-viewer.tablet-mode {
            width: 768px;
            height: 100%;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }
        
        #code-viewer.mobile-mode {
            width: 375px;
            height: 100%;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }
        /* === TOOLS & TOAST === */
        
        .header-tools {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }
        
        .tool-icon {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: 0.2s;
            min-width: auto;
        }
        
        .tool-icon:hover {
            color: var(--accent-red);
            transform: rotate(15deg);
        }
        /* === MEDIA QUERIES FOR FULL RESPONSIVENESS === */
        
        @media screen and (max-width: 900px) {
            .workspace {
                flex-direction: column;
                height: 750px;
            }
            .panel {
                height: 360px;
            }
        }
        
        @media screen and (max-width: 600px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px 15px;
                border-radius: 12px;
            }
            button {
                width: 100%;
                min-width: unset;
            }
            .summary-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .summary-details {
                width: 100%;
            }
            .edit-jump {
                align-self: flex-end;
                margin-top: 0;
            }
        }
        /* === ENHANCEMENTS === */
        
        [hidden] {
            display: none !important;
        }
        
        .step-title {
            margin: 0 0 12px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 700;
            color: var(--text-sub);
            text-align: center;
        }
        
        .toggle-btn,
        .edit-jump,
        .tool-icon,
        .vm-btn,
        .tab,
        #toast button {
            min-width: 0;
            flex: none;
            width: auto;
        }
        
        #line-numbers {
            white-space: pre;
        }
        
        #code-viewer {
            max-width: 100%;
        }
        
        .invalid {
            border-color: #f87171 !important;
            animation: shake .3s;
        }
        
        @keyframes shake {
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }
        
        button:focus-visible,
        a:focus-visible,
        select:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent-red);
            outline-offset: 2px;
        }
        
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-red);
        }
        
        .tab {
            background: none;
            color: var(--text-sub);
            border-radius: 8px 8px 0 0;
            padding: 10px 14px;
            font-size: 13px;
            text-transform: none;
        }
        
        .tab:hover {
            background: #1a1111;
        }
        
        .tab.active {
            background: var(--input-bg);
            color: #fff;
            box-shadow: inset 0 -2px var(--accent-red);
        }
        
        .tab b {
            background: var(--accent-red);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 11px;
            margin-left: 6px;
        }
        /* Saved versions module */
        
        .vm-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .vm-bar input,
        .vm-bar select {
            margin: 0;
            flex: 1;
            min-width: 160px;
            text-align: left;
            font-weight: normal;
            padding: 10px 12px;
        }
        
        .vm-bar button {
            flex: none;
        }
        
        .vm-usage {
            color: #888;
            font-size: 12px;
            align-self: center;
        }
        
        .vm-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        
        .vm-card {
            background: var(--input-bg);
            border: 1px solid #3a1c1c;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        
        .vm-card.pinned {
            border-color: var(--accent-red);
        }
        
        .vm-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: baseline;
        }
        
        .vm-head h4 {
            margin: 0;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .vm-date,
        .vm-meta {
            font-size: 11px;
            color: #999;
        }
        
        .vm-date {
            white-space: nowrap;
        }
        
        .vm-note {
            font-size: 12px;
            color: var(--text-sub);
        }
        
        .vm-snip {
            font-size: 12px;
            color: #bbb;
            line-height: 1.4;
        }
        
        .vm-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
            padding-top: 6px;
        }
        
        .vm-btn {
            padding: 4px 9px;
            font-size: 11px;
            border-radius: 5px;
            background: #2a1616;
            color: var(--text-sub);
            border: 1px solid var(--border-red);
            text-transform: none;
        }
        
        .vm-btn:hover {
            background: #3f2222;
            color: #fff;
        }
        
        .vm-btn.ok {
            background: var(--success);
            color: #000;
            border-color: var(--success);
        }
        
        .vm-btn.del {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }
        
        .vm-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 30px 10px;
            font-size: 13px;
        }
        
        .vm-foot {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .vm-foot .btn-secondary {
            flex: none;
            padding: 8px 14px;
            font-size: 12px;
        }
        
        #vm-dialog {
            width: min(900px, 95vw);
            height: 85vh;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            padding: 12px;
        }
        
        #vm-dialog[open] {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        #vm-dialog::backdrop {
            background: rgba(0, 0, 0, .8);
        }
        
        .dlg-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        
        .dlg-head button {
            flex: none;
            padding: 6px 12px;
        }
        
        #vm-frame {
            flex: 1;
            border: 0;
            background: #fff;
            border-radius: 8px;
        }
        /* Toast */
        
        #toast {
            position: fixed;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(74, 222, 128, .4);
            transition: bottom .4s cubic-bezier(.68, -.55, .265, 1.55);
            z-index: 1000;
            font-size: 13px;
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 92vw;
        }
        
        #toast.show {
            bottom: 20px;
        }
        
        #toast.err {
            background: #f87171;
            box-shadow: 0 5px 15px rgba(239, 68, 68, .4);
        }
        
        #toast button {
            background: #000;
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
            .workspace {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-act" hidden>Undo</button></div>

    <div class="container" id="main-container">

        <div class="header-tools">
            <button class="tool-icon" onclick="clearData()" title="Reset All Fields" aria-label="Reset all fields">↺</button>
        </div>

        <h2 ondblclick="window.location.href='home.html'" style="cursor: pointer;">Email Studio</h2>

        <nav class="tabs" role="tablist">
            <button class="tab" id="tab-vm" role="tab" aria-selected="false" onclick="switchTab('vm')">🗂 Saved Versions <b id="vm-count">0</b></button>
            <button class="tab active" id="tab-wiz" role="tab" aria-selected="true" onclick="switchTab('wiz')">✉ Composer</button>
        </nav>

        <div id="view-wiz">
            <div class="progress-container">
                <div class="progress-bar" id="prog-bar"></div>
            </div>

            <!-- STEP 1: Sender Name (Moved to First Step) -->
            <div id="step-1" class="step active">
                <label for="sender-mode-select">Who is the Sender ?</label>
                <select id="sender-mode-select" onchange="toggleSenderMode(); saveData()">
                <option value="default">Keep Sender as "Ajith R"</option>
                <option value="custom">Custom Sender Name</option>
            </select>

                <div id="default-sender-box">
                    <input type="text" id="fill4" value="Ajith R" oninput="saveData()">
                </div>

                <div id="custom-sender-box" style="display: none;">
                    <label for="custom-sender-input" style="font-size:14px; text-align:left;">Custom Sender Name:</label>
                    <input type="text" id="custom-sender-input" placeholder="Enter Custom Name" oninput="saveData()">
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="goToStep(2)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 2: Subject -->
            <div id="step-2" class="step">
                <label for="fill1">What is the Subject ?</label>
                <input type="text" id="fill1" value="Project Status Update" oninput="saveData()">
                <div class="btn-group">
                    <button class="btn-secondary" onclick="goToStep(1)">← Back</button>
                    <button class="btn-primary" onclick="goToStep(3)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 3: Recipient Name -->
            <div id="step-3" class="step">
                <label for="fill2">Who is the Recipient ?</label>
                <input type="text" id="fill2" placeholder="e.g., Reporting Manager" oninput="saveData()">
                <div class="btn-group">
                    <button class="btn-secondary" onclick="goToStep(2)">← Back</button>
                    <button class="btn-primary" onclick="goToStep(4)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 4: Body Content -->
            <div id="step-4" class="step">
                <label for="fill3">Enter the Body Content</label>

                <div class="action-links">
                    <a href="https://gemini.google.com/app" class="action-link" target="_blank" rel="noopener noreferrer" title="Open Mail Generator">GENERATE MAIL</a>
                    <a href="https://gemini.google.com/app/67805154c3552eb8" class="action-link" target="_blank" rel="noopener noreferrer" title="Generate Body Content">GENERATE HTML</a>
                </div>

                <textarea id="fill3" placeholder="Type or paste your professional update here..." oninput="updateCounter(); saveData()"></textarea>
                <div class="counter" id="word-count">0 characters | 0 words</div>

                <div class="html-toggle-container">
                    <label class="html-toggle">
                <input type="checkbox" id="raw-html-toggle" onchange="toggleRawHtml()"> Paste as Raw HTML
            </label>
                </div>

                <div class="btn-group">
                    <button class="btn-secondary" onclick="goToStep(3)">← Back</button>
                    <button class="btn-primary" onclick="goToStep(5)">Get Final Check ✓</button>
                </div>
            </div>

            <!-- STEP 5: Final Check Summary, Version Manager & Code Workspace -->
            <div id="step-5" class="step">
                <h3 class="step-title">Preview &amp; Export Studio</h3>

                <div class="summary-box">
                    <div class="summary-row">

    <script>
        const $ = id => document.getElementById(id);
        const KEY_DRAFT = 'emailWizardData',
            KEY_VERS = 'emailStudioVersions',
            MAX_VERSIONS = 30;
        const DEFAULTS = {
            f1: 'Project Status Update',
            f4: 'Ajith R'
        };
        let currentStep = 1,
            tab = 'wiz',
            toastTimer, viewTimer;

        const store = {
            get(k, d) {
                try {
                    const value = localStorage.getItem(k);
                    return value === null ? d : JSON.parse(value);
                } catch {
                    return d;
                }
            },
            set(k, v) {
                try {
                    localStorage.setItem(k, JSON.stringify(v));
                    return true;
                } catch {
                    return false;
                }
            },
            del(k) {
                try {
                    localStorage.removeItem(k);
                } catch {}
            }
        };
        const esc = s => {
            const value = String(s || '');
            const entities = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };

            return value.replace(/[&<>"']/g, char => entities[char]);
        };
        const newId = () => 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

        /* ---------- Toast ---------- */
        function showToast(msg, o = {}) {
            const t = $('toast'),
                act = $('toast-act');
            $('toast-msg').textContent = msg;
            t.className = 'show ' + (o.type || 'ok');
            act.hidden = !o.action;
            act.textContent = o.label || 'Undo';
            act.onclick = () => {
                o.action && o.action();
                hideToast();
            };
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, o.action ? 6000 : 2800);
        }
        const hideToast = () => $('toast').classList.remove('show');

        /* ---------- Form state ---------- */
        const state = () => ({
            f1: $('fill1').value,
            f2: $('fill2').value,
            f3: $('fill3').value,
            f4: $('fill4').value,
            senderMode: $('sender-mode-select').value,
            customSender: $('custom-sender-input').value,
            isRaw: $('raw-html-toggle').checked
        });

        function senderName(d) {
            const custom = d.senderMode === 'custom';
            return String((custom ? d.customSender : d.f4) || '').trim() || (custom ? 'Custom Sender' : DEFAULTS.f4);
        }

        function applyState(d) {
            $('fill1').value = d.f1 || '';
            $('fill2').value = d.f2 || '';
            $('fill3').value = d.f3 || '';
            $('fill4').value = d.f4 || DEFAULTS.f4;
            $('sender-mode-select').value = d.senderMode === 'custom' ? 'custom' : 'default';
            $('custom-sender-input').value = d.customSender || '';
            $('raw-html-toggle').checked = Boolean(d.isRaw);
            toggleSenderMode();
            toggleRawHtml();
            updateCounter();
        }
        const saveData = () => store.set(KEY_DRAFT, state());

        function loadData() {
            const d = store.get(KEY_DRAFT, null);
            if (d) applyState(d);
        }

        function clearData() {
            if (!confirm('Clear all fields? Your saved versions are not affected.')) return;
            store.del(KEY_DRAFT);
            applyState({...DEFAULTS
            });
            goToStep(1, true);
        }

        function toggleRawHtml() {
            const raw = $('raw-html-toggle').checked,
                ta = $('fill3');
            ta.classList.toggle('code-mode', raw);
            ta.placeholder = raw ? 'Paste your raw <div> or <table> HTML code here...' : 'Type or paste your professional update here...';
            saveData();
        }

        function toggleSenderMode() {
            const custom = $('sender-mode-select').value === 'custom';
            $('default-sender-box').style.display = custom ? 'none' : 'block';
            $('custom-sender-box').style.display = custom ? 'block' : 'none';
        }

        function updateCounter() {
            const t = $('fill3').value,
                words = t.trim() ? t.trim().split(/\s+/).length : 0;
            $('word-count').textContent = `${t.length} characters | ${words} words`;
        }

        /* ---------- Wizard navigation + validation ---------- */
        const fieldFor = s => s === 1 ? ($('sender-mode-select').value === 'custom' ? $('custom-sender-input') : $('fill4')) : $({
            2: 'fill1',
            3: 'fill2',
            4: 'fill3'
        }[s]);
        const valid = s => s > 4 || fieldFor(s).value.trim() !== '';

        function flag(s) {
            const el = fieldFor(s);
            el.classList.add('invalid');
            el.focus();
            showToast('Please fill in this field to continue', {
                type: 'err'
            });
        }

        function layout() {
            $('main-container').style.maxWidth = (tab === 'vm' || currentStep === 5) ? '1100px' : '600px';
        }

        function show(n) {
            currentStep = n;
            layout();
            $('prog-bar').style.width = n * 20 + '%';
            document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s.id === 'step-' + n));
            if (n === 5) generateWorkspaceCode();
            if (n < 5) setTimeout(() => fieldFor(n).focus(), 100);
        }

        function goToStep(n, force) {
            if (!force)
                for (let s = currentStep; s < n; s++) {
                    if (!valid(s)) {
                        if (s !== currentStep) show(s);
                        flag(s);
                        return;
                    }
                }
            show(n);
        }

        function switchTab(t) {
            tab = t;
            $('view-wiz').hidden = t !== 'wiz';
            $('view-vm').hidden = t !== 'vm';
            ['wiz', 'vm'].forEach(k => {
                $('tab-' + k).classList.toggle('active', k === t);
                $('tab-' + k).setAttribute('aria-selected', k === t);
            });
            layout();
            if (t === 'vm') VM.render();
        }

        /* ---------- Email builder ---------- */
        function renderBody(text, isRaw) {
            if (isRaw) return text;
            const link = s => s.replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '<a href="$1" style="color:#ef4444;">$1</a>');
            const paras = esc(text).split(/\n+/).map(l => l.trim()).filter(Boolean)
                .map(l => `<p style="margin:0 0 14px;">${link(l)}</p>`).join('');
            return `<div style="margin-top:20px; font-size:15px; line-height:24px; color:#cccccc;">${paras}</div>`;
        }

        function buildHtml(d) {
            const map = new Map([
                ['1', esc(d.f1 || '')],
                ['2', esc(d.f2 || '')],
                ['3', renderBody(d.f3 || '', d.isRaw)],
                ['4', esc(senderName(d))]
            ]);

            return $('template-source').textContent.trimStart().replace(
                /<!-- FILL ([1-4]) -->/g,
                (match, n) => map.get(n) ? map.get(n) : match
            );
        }


        function generateWorkspaceCode() {
            const d = state();
            const snip = (d.isRaw ? d.f3.replace(/<[^>]*>/g, ' ') : d.f3).replace(/\s+/g, ' ').trim();
            $('sum-sender').textContent = senderName(d);
            $('sum-subject').textContent = d.f1 || '[Blank]';
            $('sum-recipient').textContent = d.f2 || '[Blank]';
            $('sum-body').textContent = snip ? (snip.length > 50 ? snip.slice(0, 50) + '…' : snip) : '[Blank]';
            $('code-editor').value = buildHtml(d);
            syncLineNumbers();
            updateViewer(true);
        }

        /* ---------- Editor / preview ---------- */
        // Preview only: every link opens in a new tab, so clicking one can never navigate the preview frame away
        const previewDoc = html => /<head[\s>]/i.test(html) ?
            html.replace(/<head(\s[^>]*)?>/i, m => m + '<base target="_blank">') :
            '<base target="_blank">' + html;

        // Swap in a brand-new iframe on every refresh so a stale or navigated frame can never block an update
        function renderFrame(id, html) {
            const old = $(id),
                fresh = old.cloneNode(false);
            fresh.srcdoc = previewDoc(html);
            old.replaceWith(fresh);
        }

        function updateViewer(now) {
            clearTimeout(viewTimer);
            const go = () => renderFrame('code-viewer', $('code-editor').value);
            now ? go() : (viewTimer = setTimeout(go, 250));
        }

        function syncLineNumbers() {
            const n = $('code-editor').value.split('\n').length;
            $('line-numbers').textContent = Array.from({
                length: n
            }, (_, i) => i + 1).join('\n');
        }
        const syncScroll = () => {
            $('line-numbers').scrollTop = $('code-editor').scrollTop;
        };

        function toggleView(mode) {
            $('code-viewer').className = mode === 'desktop' ? '' : mode + '-mode';
            ['desktop', 'tablet', 'mobile'].forEach(m => $('btn-' + m).classList.toggle('active', m === mode));
        }

        function safeHtml(html) { // strip scripts/handlers before opening on this page's origin
            const doc = new DOMParser().parseFromString(html, 'text/html');
            doc.querySelectorAll('script,iframe,object,embed').forEach(n => n.remove());
            doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
                if (/^on/i.test(a.name) || /^(javascript|vbscript|data:text\/html)/i.test(a.value.replace(/[\u0000-\u0020\u007f-\u009f]+/g, ''))) n.removeAttribute(a.name);
            }));
            return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
        }

        function openPreviewNewTab() {
            const url = URL.createObjectURL(new Blob([safeHtml($('code-editor').value)], {
                type: 'text/html'
            }));
            window.open(url, '_blank', 'noopener');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        /* ---------- Copy / download ---------- */
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {}
            const ta = Object.assign(document.createElement('textarea'), {
                value: text
            });
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try {
                ok = document.execCommand('copy');
            } catch {}
            ta.remove();
            return ok;
        }
        async function copyFinalCode() {
            (await copyText($('code-editor').value)) ? showToast('✅ HTML code copied to clipboard!'): showToast('Copy blocked by the browser — select the code and copy it manually', {
                type: 'err'
            });
        }

        function download(name, text, type) {
            const a = Object.assign(document.createElement('a'), {
                href: URL.createObjectURL(new Blob([text], {
                    type
                })),
                download: name
            });
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        }

        function downloadHtml() {
            const slug = state().f1.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'email';
            download(slug + '.html', $('code-editor').value, 'text/html');
        }

        /* ---------- Saved Email Versions (separate module) ---------- */
        const VM = {
                q: '',
                sort: 'updated',
                all() {
                    const raw = store.get(KEY_VERS, []);
                    return (Array.isArray(raw) ? raw : []).filter(v => v && v.data)
                        .map(v => ({
                            pinned: false,
                            note: '',
                            created: Number(v.id) || Date.now(),
                            updated: Number(v.id) || Date.now(),
                            ...v
                        }));
                },
                find: (list, id) => list.find(v => String(v.id) === String(id)),
                put(list) {
                    if (!store.set(KEY_VERS, list)) {
                        showToast('Could not save — storage is full or blocked. Export a backup.', {
                            type: 'err'
                        });
                        return false;
                    }
                    this.render();
                    return true;
                },
                snapshot() {
                    const d = state();
                    d.code = (tab === 'wiz' && currentStep === 5) ? $('code-editor').value : buildHtml(d);
                    return d;
                },
                full(list) {
                    if (list.length < MAX_VERSIONS) return false;
                    showToast(`Limit of ${MAX_VERSIONS} versions reached — delete one first`, {
                        type: 'err'
                    });
                    return true;
                },
                saveFromBar() {
                    this.create($('vm-name').value);
                    $('vm-name').value = '';
                },
                create(name) { // CREATE
                    const list = this.all();
                    if (this.full(list)) return;
                    const d = this.snapshot(),
                        now = Date.now();
                    list.unshift({
                        id: newId(),
                        name: (name || d.f1 || 'Untitled Email').trim().slice(0, 80),
                        note: '',
                        pinned: false,
                        created: now,
                        updated: now,
                        data: d
                    });
                    if (this.put(list)) showToast('✅ Version saved');
                },
                patch(id, fn, msg) { // UPDATE helper
                    const list = this.all(),
                        v = this.find(list, id);
                    if (!v) return;
                    fn(v);
                    v.updated = Date.now();
                    if (this.put(list) && msg) showToast(msg);
                },
                rename(id) {
                    const v = this.find(this.all(), id),
                        n = v && prompt('Rename version:', v.name);
                    if (n && n.trim()) this.patch(id, x => {
                        x.name = n.trim().slice(0, 80);
                    }, '✏️ Renamed');
                },
                note(id) {
                    const v = this.find(this.all(), id),
                        n = v && prompt('Note for this version (leave empty to remove):', v.note);
                    if (n !== null && v) this.patch(id, x => {
                        x.note = n.trim().slice(0, 200);
                    }, '📝 Note saved');
                },
                overwrite(id) {
                    if (confirm('Replace this version with your current draft?')) this.patch(id, x => {
                        x.data = this.snapshot();
                    }, '✅ Version updated');
                },
                pin(id) {
                    this.patch(id, x => {
                        x.pinned = !x.pinned;
                    });
                },
                dup(id) {
                    const list = this.all(),
                        v = this.find(list, id);
                    if (!v || this.full(list)) return;
                    const now = Date.now();
                    list.unshift({...JSON.parse(JSON.stringify(v)),
                        id: newId(),
                        name: (v.name + ' (copy)').slice(0, 80),
                        pinned: false,
                        created: now,
                        updated: now
                    });
                    if (this.put(list)) showToast('📄 Version duplicated');
                },
                remove(id) { // DELETE (with undo)
                    const list = this.all(),
                        i = list.findIndex(v => String(v.id) === String(id));
                    if (i < 0) return;
                    const [gone] = list.splice(i, 1);
                    if (this.put(list)) showToast('🗑️ Version deleted', {
                        action: () => {
                            const l = this.all();
                            l.splice(Math.min(i, l.length), 0, gone);
                            this.put(l);
                        }
                    });
                },
                clearAll() {
                    const backup = this.all();
                    if (!backup.length) return;
                    if (confirm(`Delete all ${backup.length} saved versions?`) && this.put([])) showToast('🗑️ All versions deleted', {
                        action: () => this.put(backup)
                    });
                },
                load(id) { // READ → open in composer
                    const v = this.find(this.all(), id);
                    if (!v) return;
                    applyState(v.data);
                    switchTab('wiz');
                    goToStep(5, true);
                    if (v.data.code) {
                        $('code-editor').value = v.data.code;
                        syncLineNumbers();
                        updateViewer(true);
                    }
                    showToast('✅ Loaded “' + v.name + '”');
                },
                preview(id) {
                    const v = this.find(this.all(), id);
                    if (!v) return;
                    $('vm-title').textContent = v.name;
                    renderFrame('vm-frame', v.data.code || buildHtml(v.data));
                    $('vm-dialog').showModal();
                },
                export () {
                    const list = this.all();
                    if (!list.length) return showToast('Nothing to export yet', {
                        type: 'err'
                    });
                    download('email-studio-versions.json', JSON.stringify(list, null, 2), 'application/json');
                },
                import (input) {
                    const file = input.files[0];
                    input.value = '';
                    if (!file) return;
                    const r = new FileReader();
                    r.onload = () => {
                        try {
                            const arr = JSON.parse(r.result);
                            if (!Array.isArray(arr)) throw 0;
                            const list = this.all(),
                                now = Date.now();
                            let n = 0;
                            for (const v of arr) {
                                if (!v || typeof v.data !== 'object' || v.data === null || list.length >= MAX_VERSIONS) continue;
                                list.push({
                                    pinned: false,
                                    note: '',
                                    created: now,
                                    updated: now,
                                    ...v,
                                    id: newId(),
                                    name: String(v.name || 'Imported').slice(0, 80)
                                });
                                n++;
                            }
                            if (this.put(list)) showToast(`⬆ Imported ${n} version${n === 1 ? '' : 's'}`, {
                                type: n ? 'ok' : 'err'
                            });
                        } catch {
                            showToast('That file is not a valid versions export', {
                                type: 'err'
                            });
                        }
                    };
                    r.readAsText(file);
                },
                card(v) {
                    const d = v.data,
                        snip = String(d.f3 || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 110);
                    const b = (act, label, cls = '') => `<button class="vm-btn ${cls}" data-act="${act}" data-id="${esc(v.id)}">${label}</button>`;
                    return `<article class="vm-card${v.pinned ? ' pinned' : ''}">
            <div class="vm-head"><h4 title="${esc(v.name)}">${v.pinned ? '📌 ' : ''}${esc(v.name)}</h4><span class="vm-date">${new Date(v.updated).toLocaleDateString()}</span></div>
            <div class="vm-meta">To: ${esc(d.f2 || '—')} · From: ${esc(senderName(d))}<br>Subject: ${esc(d.f1 || '—')}</div>
            ${v.note ? `<div class="vm-note">📝 ${esc(v.note)}</div>` : ''}
            <div class="vm-snip">${esc(snip) || '[Blank body]'}</div>
            <div class="vm-actions">${b('load', 'Load', 'ok')}${b('preview', 'Preview')}${b('rename', 'Rename')}${b('note', 'Note')}${b('overwrite', 'Update')}${b('dup', 'Duplicate')}${b('pin', v.pinned ? 'Unpin' : 'Pin')}${b('remove', 'Delete', 'del')}</div>
        </article>`;
                },
                render() {
                    const all = this.all(), q = this.q.trim().toLowerCase();
                    $('vm-count').textContent = all.length;
                    $('vm-usage').textContent = `${all.length} / ${MAX_VERSIONS} saved`;
                    const by = { updated: (a, b) => b.updated - a.updated, created: (a, b) => b.created - a.created, name: (a, b) => a.name.localeCompare(b.name) };
                    const list = all.filter(v => !q || [v.name, v.note, v.data.f1, v.data.f2].join(' ').toLowerCase().includes(q))
                        .sort((a, b) => (b.pinned - a.pinned) || by[this.sort](a, b));
                    $('vm-list').innerHTML = list.length ? list.map(v => this.card(v)).join('')
                        : `<div class="vm-empty">${all.length ? 'No versions match your search.' : 'No saved versions yet. Write an email, then choose “Save current draft”.'}</div>`;
                }
        };
        const VM_ACTIONS = ['load', 'preview', 'rename', 'note', 'overwrite', 'dup', 'pin', 'remove'];

        /* ---------- Init ---------- */
        document.addEventListener('DOMContentLoaded', () => {
            loadData(); VM.render(); layout();
            $('vm-list').addEventListener('click', e => {
                const b = e.target.closest('[data-act]');
                if (b && VM_ACTIONS.includes(b.dataset.act)) VM[b.dataset.act](b.dataset.id);
            });
            [['custom-sender-input', 2], ['fill4', 2], ['fill1', 3], ['fill2', 4]].forEach(([id, n]) =>
                $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goToStep(n); } }));
            document.addEventListener('input', e => e.target.classList && e.target.classList.remove('invalid'));
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); VM.create(); }
            });
        });
    </script>
</body>

</html>
